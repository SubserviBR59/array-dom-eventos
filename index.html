
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semana 04 - Arrays, DOM e Eventos</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7fb;
      margin: 0;
      padding: 30px;
      color: #18243a;
    }

    main {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      color: #315cbb;
    }

    .cartao {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px #ddd;
    }

    input {
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      padding: 10px 15px;
      background-color: #315cbb;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #244895;
    }

    li {
      padding: 10px;
      margin: 5px 0;
      background: #edf4ff;
      border-radius: 5px;
      cursor: pointer;
    }

    .destaque {
      background-color: yellow;
      font-weight: bold;
    }

    .feito {
      text-decoration: line-through;
      color: gray;
      background-color: #ddd;
    }
  </style>

  <script src="app.js" defer></script>
</head>

<body>
  <main>

    <h1 id="titulo">Título original</h1>

    <p class="texto">
      Atividade prática de Arrays, DOM e Eventos.
    </p>

    <p class="texto">
      Abra o console com F12 para visualizar os resultados.
    </p>

    <div class="cartao">
      <h2>Eventos</h2>

      <button id="botao" type="button">
        Clique aqui
      </button>

      <p>Digite seu nome:</p>

      <input
        type="text"
        id="nome"
        placeholder="Digite seu nome"
      >
    </div>

    <div class="cartao">
      <h2>Lista de Tarefas</h2>

      <p>Clique nos itens para marcar como feito.</p>

      <ul id="lista">
        <li>Primeiro item</li>
        <li>Segundo item</li>
        <li>Terceiro item original</li>
      </ul>

      <h3>Adicionar nova tarefa</h3>

      <form id="formulario">
        <input
          type="text"
          id="tarefa"
          placeholder="Digite uma tarefa"
        >

        <button type="submit">
          Adicionar
        </button>
      </form>
    </div>

  </main>
</body>
</html>
